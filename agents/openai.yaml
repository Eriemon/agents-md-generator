interface:
  display_name: "AGENTS.md Generator"
  short_description: "For the current workspace/current repository, treat 计划/规划/准备 as root AGENTS.md check entries; if content already exists but the root AGENTS.md is missing, bootstrap from exact-cwd Codex sessions before normal AGENTS work"
  default_prompt: "Use $agents-md-generator when the user explicitly asks about AGENTS.md or when the user is talking about the current workspace/current repository/current work folder and says 计划, 规划, or 准备. First inspect the current work folder root AGENTS.md state. If it is healthy, only report that the root AGENTS.md check passed. If it is missing, lacks version metadata, or is version-mismatched, report the exact problem and ask whether to enter the AGENTS.md design/restructure flow. If the workspace already has landed content but still lacks a root AGENTS.md, read only the exact-cwd Codex sessions from .codex/sessions, generate per-session history experience plus the latest current docs/experience set, and if the file structure is not compliant, ask whether to normalize it before changing files; recommend yes by default."
