interface:
  display_name: "AGENTS.md Generator"
  short_description: "For the current workspace/current repository, treat 计划/规划/准备 as root AGENTS.md check entries, route explanations and planning through explicit read_only interviews, and reserve strong review gates for write/release-risk flows"
  default_prompt: "Use $agents-md-generator when the user explicitly asks about AGENTS.md or when the user is talking about the current workspace/current repository/current work folder and says 计划, 规划, or 准备. If the user explicitly asks for Codex token usage statistics, token consumption totals, or a Codex token usage review, do not start the AGENTS interview. Instead, only in Codex environments where `$CODEX_HOME/sessions` or `~/.codex/sessions` exists, run `python skills/agents-md-generator/scripts/codex_token_usage_review.py` with the requested flags and report the result; if the Codex sessions directory is missing, refuse to run and explain why. Keep `--sessions-root` inside the active Codex sessions tree; it is for testing or diagnostics only and must not escape the current Codex sessions root. Do not trigger this token-usage path for generic cost, optimization, or session-health questions unless the user explicitly asks for Codex token usage statistics. First inspect the current work folder root AGENTS.md state. If the root check is only a current-workspace/current-repository/current-work-folder 计划/规划/准备 trigger and the root AGENTS.md is healthy, only report that the root AGENTS.md check passed; if the user explicitly asked to create, update, review, or repair AGENTS governance, continue with the full design/update interview. If the root AGENTS.md is missing or lacks version metadata, report the exact problem and continue with the full design interview instead of takeover. When the root AGENTS.md specifies a default conversation language, obey it for all natural-language replies unless the user explicitly switches languages. For old work folders that already have landed content and whose root AGENTS.md is version-mismatched, do not launch the full design interview; switch into takeover mode, confirm only the project type, name, default language, and remote structure when facts cannot prove `not configured`, then bootstrap exact-cwd Codex session history, force local workspace reorganization, and write remote directory governance planning. In takeover mode, treat remote structure governance as separate from the remote-server enablement and task-route mapping flow: even when remote structure is already known, still explicitly ask whether the work folder needs remote servers and require the full erie-remote-ssh dependency/configuration/route-mapping/validation chain before writing remote routes into AGENTS.md. For external work folders, governance runtime commands must call the installed `agents-md-generator` runtime such as `python <codex-home>/skills/agents-md-generator/scripts/manage_docs.py ...`; never tell the user to vendor these governance scripts into the target project's own `scripts/` tree. Only the owner repo for `agents-md-generator` may keep repo-local `python skills/agents-md-generator/scripts/...` bootstrap commands. For explanations, analysis, planning, current-state checks, and read-only review, start `collect_design_profile.py` with `--intent read_only`; that path must preserve `answers_snapshot` and `profile_preview` but must not trigger subagent `design_review` until the caller explicitly runs `--enter-write-review`. Only write intent and other governance-high-risk flows should trigger subagent review dispatch. When generating or restructuring AGENTS.md, explicitly ask for and confirm the default conversation language. Also explicitly ask whether the work folder needs remote servers; future remote server validation must start with the matched task route primary server, automatically try registered fallback servers after failed validation, and stop for unmatched tasks until AGENTS.md is updated. Work-folder engineering config must stay under `.settings/`: local-only config uses `.settings/project.local.json` or `.settings/<name>.local.json`, remote project config uses `.settings/project.remote.json` or `.settings/<name>.remote.json`, and `.settings/*.local.json` such as `.settings/server_list.local.json` must never be copied to remote servers. Root-level work artifacts such as `tests/`, `smoke/` and `smoke-*`, `reports/`, and `runs/` belong only at the work-folder root and must not be placed under `skills/<skill-name>/` or `engineering/<project-name>/`, while governed skill-local `evals/` may stay under `skills/<skill-name>/evals/` and enter installable releases. When generating managed root AGENTS.md, include Code Comment Policy from code_comment_policy in .agents/global-rule-overrides.json, summarize the Chinese Python/C/C++/Verilog rules, keep examples in references, and state that 禁止未经明确要求的批量 AI 注释. Keep long Python heartbeat detail, line-limit/decomposition-plan detail, GUI script exceptions, and configurable comment-policy detail in .agents/global-rule-overrides.json. Ask installation questions only for skill-development release flows, never for engineering projects."
