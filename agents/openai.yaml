interface:
  display_name: "AGENTS.md Generator"
  short_description: "For the current workspace/current repository, treat 计划/规划/准备 as root AGENTS.md check entries, route explanations and planning through explicit read_only interviews, and reserve strong review gates for write/release-risk flows"
  # Global baseline v3 keeps cross-repository defaults only: Coding Behavior Baseline, Comments And Documentation, Environment And Dependency Safety, installed skill protection, and Markdown documentation formulas.
  default_prompt: "Use $agents-md-generator when the user explicitly asks about AGENTS.md or when the user is talking about the current workspace/current repository/current work folder and says 计划, 规划, or 准备. If the user explicitly asks for Codex token usage statistics, token consumption totals, or a Codex token usage review, do not start the AGENTS interview; only in Codex environments where `$CODEX_HOME/sessions` or `~/.codex/sessions` exists, run `python skills/agents-md-generator/scripts/python/detect/codex_token_usage_review.py`, keep `--sessions-root` inside the active Codex sessions tree. Do not trigger this token-usage path for generic cost, optimization, or session-health questions. First inspect the current work folder root AGENTS.md state. If the check is only a 计划/规划/准备 trigger and the root is healthy, only report that the root AGENTS.md check passed, but continue with the full design/update interview for explicit AGENTS governance requests. Missing root AGENTS.md or missing version metadata must be reported exactly and routed to the full design interview. Version-mismatched old work folders with landed content may enter takeover mode: confirm minimal identity/default language/remote structure when facts cannot prove `not configured`, bootstrap exact-cwd Codex sessions, and treat remote structure governance as separate from the remote-server enablement and task-route mapping flow. External work folders must call the installed `agents-md-generator` runtime instead of vendoring governance scripts. Strong-control work folders must pass memory-gate and bootstrap exact-cwd sessions before verification can pass. For explanations, analysis, planning, current-state checks, and read-only review, start `collect_design_profile.py` with `--intent read_only`; only write intent and governance-high-risk flows should trigger subagent review dispatch. When generating or restructuring AGENTS.md, explicitly ask for and confirm the default conversation language, explicitly ask whether the work folder needs remote servers, future remote server validation must resolve the matched task route primary server from `.agents/agents-control.json`, automatically try registered fallback servers after failed validation, and stop for unmatched tasks until AGENTS.md/profile is updated. Root AGENTS.md is a compact operational index: do not inline remote server names, functions, runners, absolute paths, or full route registries; keep those facts in `.agents/agents-control.json` and docs governance sources. Global AGENTS.md is also compact: keep only cross-repository defaults there, including baseline_version=3, reuse-first execution mode, advisory task_rating_gate.py use, Coding Behavior Baseline with lightweight dual-skill preflight routing that says Python/script-family work must think first, load both `readable-python-generator` and `readable-script-generator`, pass both gates before continuing, and keep final ownership with the correct target-language skill, Comments And Documentation without skill-selection rules, Environment And Dependency Safety, installed skill protection, and Markdown documentation formulas; keep thresholds, script layouts, long-task details, release policy, and language-specific comment rules in the project AGENTS.md or .agents/global-rule-overrides.json. Work-folder engineering config must stay under `.settings/`, and `.settings/*.local.json` such as `.settings/server_list.local.json` must never be copied to remote servers. Root-level work artifacts such as `tests/`, `smoke/` and `smoke-*`, `reports/`, and `runs/` belong only at the work-folder root, while governed skill-local `evals/` may stay under `skills/<skill-name>/evals/` and enter installable releases. When generating managed root AGENTS.md, include Coding Behavior Baseline language skill routing from coding_behavior.language_skill_routing in .agents/global-rule-overrides.json: Python and script-family create/modify work must think first, explicitly load both readable skills, and pass both gates before continuing; Python keeps final ownership with `readable-python-generator`; bat/cmd, shell/bash, PowerShell, and Tcl script work keep final ownership with `readable-script-generator`; the script route must still say Python 目标继续使用 `readable-python-generator`; script wrappers that call Python remain script targets; and the root must still state that 严禁把代码压缩到一行 and 严禁生成人看不懂的炫技代码. Also include Script Output Policy from script_output_policy in .agents/global-rule-overrides.json. Keep long Python heartbeat detail, 64KB size-limit/decomposition-plan detail, readability gate detail, GUI script exceptions, configurable language-skill-routing detail, and configurable script-output-policy detail in .agents/global-rule-overrides.json. Ask installation questions only for skill-development release flows, never for engineering projects."
