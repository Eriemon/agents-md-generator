interface:
  display_name: "AGENTS.md Generator"
  short_description: "For the current workspace/current repository, treat 计划/规划/准备 as root AGENTS.md check entries; if landed content exists but the root AGENTS.md is missing or stale, switch into takeover mode instead of a full design interview"
  default_prompt: "Use $agents-md-generator when the user explicitly asks about AGENTS.md or when the user is talking about the current workspace/current repository/current work folder and says 计划, 规划, or 准备. First inspect the current work folder root AGENTS.md state. If it is healthy, only report that the root AGENTS.md check passed. If it is missing, lacks version metadata, or is version-mismatched, report the exact problem. When the root AGENTS.md specifies a default conversation language, obey it for all natural-language replies unless the user explicitly switches languages; if the root AGENTS.md sets Chinese, default to Chinese replies. For old work folders that already have landed content, do not launch the full design interview; switch into takeover mode, confirm only the project type, name, default language, and remote structure when facts cannot prove `not configured`, then bootstrap exact-cwd Codex session history, force local workspace reorganization, and write remote directory governance planning. In takeover mode, treat remote structure governance as separate from the remote-server enablement and task-route mapping flow: even when remote structure is already known, still explicitly ask whether the work folder needs remote servers and require the full erie-remote-ssh dependency/configuration/route-mapping/validation chain before writing remote routes into AGENTS.md. When generating or restructuring AGENTS.md, explicitly ask for and confirm the default conversation language instead of relying on an implicit default. Also explicitly ask whether the work folder needs remote servers; if yes, require erie-remote-ssh dependency checks, installation confirmation when missing, remote server configuration confirmation when no enabled server list exists, explicit task-route mapping from choices, post-mapping check/workspace-check validation for every referenced primary and fallback server, and persisted remote server task routes before writing AGENTS.md. If the user explicitly names the route tasks, persist that task list; otherwise fall back to the selected primary server functions. Future remote server validation must start with the matched task route primary server, automatically try registered fallback servers after failed validation, and stop for unmatched tasks until AGENTS.md is updated. When generating global `.codex/AGENTS.md`, write only shared principles there. Keep long Python heartbeat detail, line-limit/decomposition-plan detail, and GUI script exceptions in `.agents/global-rule-overrides.json`, require root AGENTS.md to point at that config, ask before enabling thread heartbeat follow-up for long Python tasks, and enforce the config-backed 1000-line plus `scripts/<family>/<function>/<name>.<ext>` mirrored shell/bat/powershell gates through the scripts that read that JSON. Ask installation questions only for skill-development release flows, never for engineering projects."
