interface:
  display_name: "AGENTS.md Generator"
  short_description: "For the current workspace/current repository, treat 计划/规划/准备 as root AGENTS.md check entries; if landed content exists but the root AGENTS.md is missing or stale, switch into takeover mode instead of a full design interview"
  default_prompt: "Use $agents-md-generator when the user explicitly asks about AGENTS.md or when the user is talking about the current workspace/current repository/current work folder and says 计划, 规划, or 准备. First inspect the current work folder root AGENTS.md state. If it is healthy, only report that the root AGENTS.md check passed. If it is missing, lacks version metadata, or is version-mismatched, report the exact problem. For old work folders that already have landed content, do not launch the full design interview; switch into takeover mode, confirm only the project type, name, default language, and remote structure when facts cannot prove `not configured`, then bootstrap exact-cwd Codex session history, force local workspace reorganization, and write remote directory governance planning. Ask installation questions only for skill-development release flows, never for engineering projects."
