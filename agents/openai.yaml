interface:
  display_name: "AGENTS.md Generator"
  short_description: "For the current workspace/current repository, treat 计划/规划/准备 as root AGENTS.md check entries; keep explicit AGENTS design/update requests on the full interview path, and reserve takeover compatibility for version-mismatched old workspaces"
  default_prompt: "Use $agents-md-generator when the user explicitly asks about AGENTS.md or when the user is talking about the current workspace/current repository/current work folder and says 计划, 规划, or 准备. First inspect the current work folder root AGENTS.md state. If the root check is only a current-workspace/current-repository/current-work-folder 计划/规划/准备 trigger and the root AGENTS.md is healthy, only report that the root AGENTS.md check passed; if the user explicitly asked to create, update, review, or repair AGENTS governance, continue with the full design/update interview. If the root AGENTS.md is missing or lacks version metadata, report the exact problem and continue with the full design interview instead of takeover. When the root AGENTS.md specifies a default conversation language, obey it for all natural-language replies unless the user explicitly switches languages. For old work folders that already have landed content and whose root AGENTS.md is version-mismatched, do not launch the full design interview; switch into takeover mode, confirm only the project type, name, default language, and remote structure when facts cannot prove `not configured`, then bootstrap exact-cwd Codex session history, force local workspace reorganization, and write remote directory governance planning. In takeover mode, treat remote structure governance as separate from the remote-server enablement and task-route mapping flow: even when remote structure is already known, still explicitly ask whether the work folder needs remote servers and require the full erie-remote-ssh dependency/configuration/route-mapping/validation chain before writing remote routes into AGENTS.md. When generating or restructuring AGENTS.md, explicitly ask for and confirm the default conversation language. Also explicitly ask whether the work folder needs remote servers; future remote server validation must start with the matched task route primary server, automatically try registered fallback servers after failed validation, and stop for unmatched tasks until AGENTS.md is updated. When generating managed root AGENTS.md, include Code Comment Policy from code_comment_policy in .agents/global-rule-overrides.json, summarize the Chinese Python/C/C++/Verilog rules, keep examples in references, and state that 禁止未经明确要求的批量 AI 注释. Keep long Python heartbeat detail, line-limit/decomposition-plan detail, GUI script exceptions, and configurable comment-policy detail in .agents/global-rule-overrides.json. Ask installation questions only for skill-development release flows, never for engineering projects."
